services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nudgeos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nudge
      POSTGRES_PASSWORD: nudge
      POSTGRES_DB: nudgeos
    ports:
      - "5433:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nudge -d nudgeos"]
      interval: 5s
      timeout: 3s
      retries: 10
